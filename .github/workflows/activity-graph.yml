name: Generate Activity Graph

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Activity Graph
        uses: Liyfez/Pastime@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/activity-graph.svg
            dist/activity-graph-dark.svg?palette=github-dark

      - name: Commit SVG
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/*.svg
          git commit -m "Update activity graph" || exit 0
          git push
