name: Generate Trophy SVG

on:
  schedule:
    - cron: "0 3 * * *"   # Executa todo dia às 3h da manhã
  workflow_dispatch:      # Permite rodar manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Generate Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&no-bg=true&column=7"
          path: images/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit SVG
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/trophy.svg
          git commit -m "Update trophy.svg" || exit 0
          git push